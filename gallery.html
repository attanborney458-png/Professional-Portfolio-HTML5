<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery - Attan Bonaventure | Professional Portfolio</title>
  <meta name="description" content="Images of students studying and a video of students interacting.">
</head>
<body>
<header>
  <!-- header: site banner, used once per page so screen readers can jump to it -->
  <h1>Attan Bonaventure - Personal Professional Portfolio</h1>
  <nav>
    <!-- nav: main navigation landmark. Link text describes the destination (no "Click Here") -->
    <a href="index.html">Home</a> |
    <a href="about.html">About Me</a> |
    <a href="gallery.html">Gallery</a> |
    <a href="data.html">Skill Proficiency</a> |
    <a href="contact.html">Contact Me</a>
  </nav>
</header>

<main>
  <h2>Gallery</h2>

  <section>
    <h3>Picture of myself</h3>
    <!-- figure + figcaption pair each image with its caption; alt text describes the image for screen readers -->
    <figure>
      <img src="images/myself-1.jpg" alt="Me standing in front of a closet" width="640">
      <figcaption>Figure 1: Myself standing in front of a closet.</figcaption>
    </figure>
    <figure>
      <img src="images/myself-2.jpg" alt="Me standing in front of a closet" width="400">
      <figcaption>Figure 2: Me standing in front of a closet.</figcaption>
    </figure>
    <figure>
      <img src="images/myself-3.jpg" alt="Me standing in front of a closet" width="400">
      <figcaption>Figure 3: Me standing in front of a closet.</figcaption>
    </figure>
  </section>

  <section>
    <h3>Video</h3>
    <!-- video with controls so users can play and pause; fallback text is shown if the browser cannot play video -->
    <figure>
      <video controls width="480">
        <source src="videos/video.mp4" type="video/mp4">
        <p>Your browser does not support the video tag. The video shows students talking and interacting with each other.</p>
      </video>
      <figcaption>Video</figcaption>
    </figure>
  </section>
</main>

<footer>
  <!-- footer: closing information for the page -->
  <p>&copy; 2026 Attan Bonaventure. Software Engineering student, Year 2.</p>
</footer>
</body>
</html>
